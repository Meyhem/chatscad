<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone sketch</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/promptcad/components/bundle.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#6e9bff}a:hover{color:#8db1ff}
.sk-grid{stroke:var(--grid-minor);stroke-width:1}
.sk-ink{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sk-dim{fill:none;stroke:var(--accent);stroke-width:1.5}
.sk-txt{fill:var(--accent);font:600 15px "JetBrains Mono",monospace}
</style>
</helmet>
<div class="app phone pc-root" data-theme="{{theme}}">
  <header class="topbar">
    <button class="pc-btn is-ghost" type="button">Cancel</button>
    <span class="grow" style="text-align: center; font-weight: 600;">Sketch</span>
    <button class="pc-btn is-ghost" type="button" aria-label="Undo"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v3.5h3.5 M3.5 6.5A5 5 0 1 1 3 9"/></svg></button>
  </header>
  <div class="phone-body" style="background: var(--inset);">
    <div style="flex: 1; min-height: 0; position: relative;">
      <svg viewBox="0 0 390 520" width="100%" height="100%" role="img" aria-label="Sketch of an L bracket, 40 by 25 mm, 3 mm thick, with a 5 mm hole">
        <line class="sk-grid" x1="0" y1="40" x2="390" y2="40"/><line class="sk-grid" x1="0" y1="80" x2="390" y2="80"/><line class="sk-grid" x1="0" y1="120" x2="390" y2="120"/><line class="sk-grid" x1="0" y1="160" x2="390" y2="160"/><line class="sk-grid" x1="0" y1="200" x2="390" y2="200"/><line class="sk-grid" x1="0" y1="240" x2="390" y2="240"/><line class="sk-grid" x1="0" y1="280" x2="390" y2="280"/><line class="sk-grid" x1="0" y1="320" x2="390" y2="320"/><line class="sk-grid" x1="0" y1="360" x2="390" y2="360"/><line class="sk-grid" x1="0" y1="400" x2="390" y2="400"/><line class="sk-grid" x1="0" y1="440" x2="390" y2="440"/><line class="sk-grid" x1="0" y1="480" x2="390" y2="480"/>
        <line class="sk-grid" x1="40" y1="0" x2="40" y2="520"/><line class="sk-grid" x1="80" y1="0" x2="80" y2="520"/><line class="sk-grid" x1="120" y1="0" x2="120" y2="520"/><line class="sk-grid" x1="160" y1="0" x2="160" y2="520"/><line class="sk-grid" x1="200" y1="0" x2="200" y2="520"/><line class="sk-grid" x1="240" y1="0" x2="240" y2="520"/><line class="sk-grid" x1="280" y1="0" x2="280" y2="520"/><line class="sk-grid" x1="320" y1="0" x2="320" y2="520"/><line class="sk-grid" x1="360" y1="0" x2="360" y2="520"/>
        <path class="sk-ink" d="M92 118 L96 380 L318 377 L316 352 L122 355 L119 117 Z"/>
        <path class="sk-ink" d="M218 366 m-12 0 a12 6 0 1 0 24 0 a12 6 0 1 0 -24 0"/>
        <path class="sk-dim" d="M96 412 L318 412 M96 404 v16 M318 404 v16"/>
        <text class="sk-txt" x="190" y="438">40</text>
        <path class="sk-dim" d="M58 118 L58 380 M50 118 h16 M50 380 h16"/>
        <text class="sk-txt" x="28" y="254">25</text>
        <path class="sk-dim" d="M128 100 L128 80 M119 92 L119 80"/>
        <text class="sk-txt" x="134" y="88">3</text>
        <path class="sk-dim" d="M230 360 L268 320"/>
        <text class="sk-txt" x="272" y="316">Ø5</text>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line);">
      <div class="pc-tabs" role="toolbar" aria-label="Sketch tools" style="align-self: stretch; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
        <button class="pc-tab" type="button" aria-pressed="true" style="height: 40px; justify-content: center; background: var(--accent-soft); color: var(--ink);"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l1-3.5 7-7 2.5 2.5-7 7z"/></svg>Pen</button>
        <button class="pc-tab" type="button" style="height: 40px; justify-content: center;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3"/></svg>Line</button>
        <button class="pc-tab" type="button" style="height: 40px; justify-content: center;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 11h11 M2.5 8.5v5 M13.5 8.5v5"/></svg>Size</button>
        <button class="pc-tab" type="button" style="height: 40px; justify-content: center;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 12.5h10 M5 10.5l5-7 3 2.5-5 6"/></svg>Erase</button>
      </div>
      <div class="pc-input"><input value="Wall bracket, two M4 screws in the long leg" aria-label="Note for Claude"></div>
      <button class="pc-btn is-primary" type="button" style="height: 44px;">Attach to prompt</button>
      <span class="pc-caption">Tap Size and drag between two points to add a dimension in mm. Sent as an image to vision models only.</span>
    </div>
    <div aria-hidden="true" style="height: 34px; background: var(--panel);"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
