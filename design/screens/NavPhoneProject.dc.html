<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone project tab</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/promptcad/components/bundle.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#6e9bff}a:hover{color:#8db1ff}
</style>
</helmet>
<div class="app phone pc-root" data-theme="{{theme}}">
  <header class="topbar">
    <button class="project" type="button" style="padding-left: 0;">18650 holder<svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></button>
    <span class="grow"></span>
    <span class="pc-status is-busy"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1 -5.5 5.5"/></svg>Rendering…</span>
    <button class="pc-btn is-icon is-ghost" type="button" aria-label="Share"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8 M4.5 6L8 2.5 11.5 6 M3 9.5v4h10v-4"/></svg></button>
    <button class="pc-btn is-icon is-ghost" type="button" aria-label="Export STL"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8 M4.5 7L8 10.5 11.5 7 M3 13.5h10"/></svg></button>
  </header>
  <div style="flex: none; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);">
    <nav class="pc-tabs" role="tablist" aria-label="Views" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%;">
      <button class="pc-tab" role="tab" aria-selected="true" type="button" style="justify-content: center; height: 40px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5.5 3v6L8 14l-5.5-3V5z M2.5 5L8 8l5.5-3 M8 8v6"/></svg>Project</button>
      <button class="pc-tab" role="tab" aria-selected="false" type="button" style="justify-content: center; height: 40px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z M8 5v3.5l2.5 1.5"/></svg>History</button>
      <button class="pc-tab" role="tab" aria-selected="false" type="button" style="justify-content: center; height: 40px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z M8 1.5v2 M8 12.5v2 M1.5 8h2 M12.5 8h2 M3.4 3.4l1.4 1.4 M11.2 11.2l1.4 1.4 M3.4 12.6l1.4-1.4 M11.2 4.8l1.4-1.4"/></svg>Settings</button>
    </nav>
  </div>
  <div class="phone-body">
    <div class="viewer">
      <svg class="scene" viewBox="150 110 380 330" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <line class="g-min" x1="305.4" y1="119.0" x2="-54.8" y2="327.0"/><line class="g-maj" x1="360.8" y1="151.0" x2="0.6" y2="359.0"/><line class="g-min" x1="416.3" y1="183.0" x2="56.0" y2="391.0"/><line class="g-maj" x1="499.4" y1="231.0" x2="139.2" y2="439.0"/><line class="g-min" x1="554.8" y1="263.0" x2="194.6" y2="471.0"/>
        <line class="g-min" x1="194.6" y1="119.0" x2="693.4" y2="407.0"/><line class="g-maj" x1="139.2" y1="151.0" x2="638.0" y2="439.0"/><line class="g-min" x1="83.7" y1="183.0" x2="582.5" y2="471.0"/><line class="g-maj" x1="0.6" y1="231.0" x2="499.4" y2="519.0"/>
        <line class="ax-x" x1="250.0" y1="215.0" x2="333.1" y2="263.0"/><line class="ax-y" x1="250.0" y1="215.0" x2="166.9" y2="263.0"/><line class="ax-z" x1="250.0" y1="215.0" x2="250.0" y2="119.0"/>
        <polygon class="m-l" points="177.9,256.6 421.8,397.4 421.8,327.0 177.9,186.2"/>
        <polygon class="m-r" points="493.9,355.8 421.8,397.4 421.8,327.0 493.9,285.4"/>
        <polygon class="m-top" points="250.0,144.6 493.9,285.4 421.8,327.0 177.9,186.2"/>
        <ellipse class="m-hole" cx="251.4" cy="187.0" rx="37.2" ry="21.5"/><ellipse class="m-hole" cx="309.6" cy="220.6" rx="37.2" ry="21.5"/><ellipse class="m-hole" cx="367.8" cy="254.2" rx="37.2" ry="21.5"/><ellipse class="m-hole" cx="426.0" cy="287.8" rx="37.2" ry="21.5"/>
      </svg>
      <div class="viewer-tl"><span class="pc-dims">88.8 × 25.4 × 22 mm</span></div>
      <div class="viewer-tr" style="flex-direction: column; gap: 8px;">
        <button class="vbtn" type="button" aria-label="Fit view" style="width: 44px; height: 44px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5v-3h3 M10.5 2.5h3v3 M13.5 10.5v3h-3 M5.5 13.5h-3v-3"/></svg></button>
        <button class="vbtn" type="button" aria-label="Camera presets" style="width: 44px; height: 44px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5.5 3v6L8 14l-5.5-3V5z M2.5 5L8 8l5.5-3 M8 8v6"/></svg></button>
      </div>
    </div>
    <div class="sheet" style="margin-top: -12px; position: relative;">
      <span class="grabber"></span>
      <div class="pc-row"><span style="font-weight: 600;">Parameters</span><span class="grow"></span><button class="pc-btn is-sm is-ghost" type="button">Reset</button><button class="pc-btn is-sm" type="button">Bake</button></div>
      <div class="pc-tabs" role="tablist" style="align-self: flex-start;"><button class="pc-tab" role="tab" aria-selected="true" type="button">Dimensions</button><button class="pc-tab" role="tab" type="button">Lid</button></div>
      <div class="pc-param is-changed" style="grid-template-columns: 72px minmax(0, 1fr) 76px; min-height: 44px;"><div class="pc-param-name">slots<small>1–8</small></div><input class="pc-range" type="range" min="1" max="8" value="5" aria-label="slots" style="height: 44px;"><div class="pc-input is-mono"><input value="5" aria-label="slots value"></div></div>
      <div class="pc-param" style="grid-template-columns: 72px minmax(0, 1fr) 76px; min-height: 44px;"><div class="pc-param-name">bore<small>17–22</small></div><input class="pc-range" type="range" min="17" max="22" step="0.5" value="19" aria-label="bore" style="height: 44px;"><div class="pc-input is-mono"><input value="19" aria-label="bore value"><span class="pc-unit">mm</span></div></div>
      <div class="pc-param" style="grid-template-columns: 72px minmax(0, 1fr) 76px; min-height: 44px;"><div class="pc-param-name">height<small>10–60</small></div><input class="pc-range" type="range" min="10" max="60" value="22" aria-label="height" style="height: 44px;"><div class="pc-input is-mono"><input value="22" aria-label="height value"><span class="pc-unit">mm</span></div></div>
    </div>
  </div>
  <nav class="pc-tabbar" role="tablist">
    <button class="pc-tab" role="tab" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7H7l-3 2.5v-2.5H2.5z"/></svg>Chat</button>
    <button class="pc-tab" role="tab" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5L2 8l3.5 3.5 M10.5 4.5L14 8l-3.5 3.5"/></svg>Code</button>
    <button class="pc-tab" role="tab" aria-selected="true" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5.5 3v6L8 14l-5.5-3V5z M2.5 5L8 8l5.5-3 M8 8v6"/></svg>3D</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
