<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Variant picker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/promptcad/components/bundle.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#6e9bff}a:hover{color:#8db1ff}
</style>
</helmet>
<div class="app pc-root" data-theme="{{theme}}" style="width: 1440px; height: 900px; position: relative;">

<header class="topbar">
  <span class="brand"><span class="brand-dot"></span>PromptCAD</span>
  <span class="sep"></span>
  <button class="project" type="button">Broom hook<svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></button>
  <span class="pc-status is-busy"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1 -5.5 5.5"/></svg>Rendering 3 of 3</span>
  <span class="grow"></span>
  <button class="pc-btn is-sm is-primary" type="button" disabled>Export STL</button>
</header>
<main class="workbench"><section class="col"></section><section class="col"><div class="viewer"></div></section><section class="col"><div class="editor"></div></section></main>

<div class="overlay" style="top: 48px;">
  <div role="dialog" aria-labelledby="vt" style="width: 100%; max-width: 1180px; display: flex; flex-direction: column; gap: 20px; padding: 24px; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-pop);">
    <div style="display: flex; align-items: flex-start; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0;">
        <h2 id="vt" style="font: 600 20px/26px var(--font-sans); letter-spacing: -0.01em;">Pick a variant</h2>
        <p class="pc-muted">“A wall hook for a 30 mm broom handle, two screws, printable without supports.” Sent to 3 models at once.</p>
      </div>
      <button class="pc-btn is-icon is-ghost" type="button" aria-label="Close"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
      <button class="pc-variant" type="button" aria-selected="true">
        <span class="pc-variant-view" style="aspect-ratio: 4 / 3;"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon class="f-l" points="14,36 50,54 50,82 14,64"/><polygon class="f-r" points="50,54 86,36 86,64 50,82"/><polygon class="f-top" points="50,18 86,36 50,54 14,36"/><ellipse class="f-hole" cx="50" cy="36" rx="12" ry="6"/></svg></span>
        <span class="pc-variant-meta"><span style="font-weight: 600;">A · claude-sonnet-5-5</span><span class="pc-status is-ok"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><polyline points="3,8.5 6.5,12 13,4.5"/></svg>Rendered</span></span>
        <span class="pc-variant-meta pc-caption"><span class="pc-mono">62 × 38 × 44 mm · 5 params</span><span class="pc-mono">$0.012</span></span>
      </button>
      <button class="pc-variant" type="button">
        <span class="pc-variant-view" style="aspect-ratio: 4 / 3;"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon class="f-l" points="8,46 50,66 50,78 8,58"/><polygon class="f-r" points="50,66 92,46 92,58 50,78"/><polygon class="f-top" points="50,26 92,46 50,66 8,46"/><ellipse class="f-hole" cx="36" cy="46" rx="8" ry="4"/><ellipse class="f-hole" cx="64" cy="46" rx="8" ry="4"/></svg></span>
        <span class="pc-variant-meta"><span style="font-weight: 600;">B · gpt-5-mini</span><span class="pc-status is-warn"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5l6 11H2z M8 6.5v3.5 M8 11.5v1"/></svg>2 warnings</span></span>
        <span class="pc-variant-meta pc-caption"><span class="pc-mono">70 × 34 × 20 mm · 3 params</span><span class="pc-mono">$0.003</span></span>
      </button>
      <button class="pc-variant" type="button">
        <span class="pc-variant-view" style="aspect-ratio: 4 / 3;"><span class="pc-status is-busy"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1 -5.5 5.5"/></svg>Rendering…</span></span>
        <span class="pc-variant-meta"><span style="font-weight: 600;">C · qwen3-coder (local)</span><span class="pc-status">Queued</span></span>
        <span class="pc-variant-meta pc-caption"><span class="pc-mono">waiting for the renderer</span><span class="pc-mono">$0.000</span></span>
      </button>
    </div>

    <div class="pc-row" style="justify-content: space-between;">
      <span class="pc-caption">Drag to orbit any preview. The two you don't pick stay in history as variants.</span>
      <div class="pc-row">
        <button class="pc-btn is-ghost" type="button">Discard all</button>
        <button class="pc-btn" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v3.5h3.5 M3.5 6.5A5 5 0 1 1 3 9"/></svg>Regenerate</button>
        <button class="pc-btn is-primary" type="button">Use variant A</button>
      </div>
    </div>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
