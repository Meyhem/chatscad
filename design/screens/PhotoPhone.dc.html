<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, new project from photos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/chatscad/components/bundle.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#6e9bff}a:hover{color:#8db1ff}
</style>
</helmet>
<div class="app phone pc-root" data-theme="{{theme}}">
  <header class="topbar">
    <button class="pc-btn is-ghost" type="button">Cancel</button>
    <span class="grow" style="text-align: center; font-weight: 600;">New project</span>
    <span style="width: 72px;"></span>
  </header>
  <div class="phone-body" style="padding: 16px; gap: 12px;">
    <div class="pc-field">
      <label for="pp-name">Name</label>
      <div class="pc-input"><input id="pp-name" value="Curtain rod bracket"></div>
    </div>
    <div class="pc-tabs" role="radiogroup" aria-label="Start from" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
      <button class="pc-tab" role="radio" type="button" aria-checked="false" aria-selected="false" style="justify-content: center; height: 40px;">Blank</button>
      <button class="pc-tab" role="radio" type="button" aria-checked="true" aria-selected="true" style="justify-content: center; height: 40px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h2.5l1-1.5h4l1 1.5h2.5v7.5h-11z M8 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"></path></svg>Photos</button>
    </div>
    <div class="pc-row" style="justify-content: space-between;">
      <span style="font-weight: 600; font-size: 13px;" id="pp-photos">Photos</span>
      <div class="pc-tabs" role="radiogroup" aria-labelledby="pp-photos">
        <button class="pc-tab" role="radio" type="button" aria-checked="{{oneSel}}" aria-selected="{{oneSel}}" onClick="{{pickOne}}">One</button>
        <button class="pc-tab" role="radio" type="button" aria-checked="{{anglesSel}}" aria-selected="{{anglesSel}}" onClick="{{pickAngles}}">Several angles</button>
      </div>
    </div>

    <sc-if value="{{isAngles}}" hint-placeholder-val="{{ true }}">
      <div class="slots is-two">
        <div class="slot is-filled">
          <svg class="photo" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect class="ph-bg" width="160" height="120"></rect><rect class="ph-shade" y="94" width="160" height="26"></rect><rect class="ph-obj" x="30" y="16" width="14" height="80"></rect><rect class="ph-lit" x="44" y="76" width="56" height="12"></rect><path class="ph-obj" d="M95 40 h8 v28 a14 14 0 0 0 28 0 v-28 h8 v28 a22 22 0 0 1 -44 0 z"></path><ellipse class="ph-coin" cx="140" cy="106" rx="11" ry="6"></ellipse></svg>
          <span class="slot-tag">Front</span>
          <button class="slot-x" type="button" aria-label="Remove front photo"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8 M12 4l-8 8"></path></svg></button>
        </div>
        <button class="slot" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true" style="width: 20px; height: 20px;"><path d="M2.5 5h2.5l1-1.5h4l1 1.5h2.5v7.5h-11z M8 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"></path></svg>Take top</button>
        <button class="slot" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true" style="width: 20px; height: 20px;"><path d="M2.5 5h2.5l1-1.5h4l1 1.5h2.5v7.5h-11z M8 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"></path></svg>Take side</button>
        <button class="slot" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true" style="width: 20px; height: 20px;"><path d="M2.5 5h2.5l1-1.5h4l1 1.5h2.5v7.5h-11z M8 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"></path></svg>Take back</button>
      </div>
      <span class="pc-caption">One is enough to start. Tap a slot to take a photo or pick one from the library.</span>
    </sc-if>

    <sc-if value="{{isOne}}" hint-placeholder-val="{{ false }}">
      <div class="slot is-filled" style="aspect-ratio: 16 / 10;">
        <svg class="photo" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect class="ph-bg" width="160" height="100"></rect><rect class="ph-shade" y="80" width="160" height="20"></rect><rect class="ph-obj" x="30" y="10" width="13" height="72"></rect><rect class="ph-lit" x="43" y="64" width="54" height="11"></rect><path class="ph-obj" d="M92 32 h8 v26 a13 13 0 0 0 26 0 v-26 h8 v26 a21 21 0 0 1 -42 0 z"></path><ellipse class="ph-coin" cx="140" cy="89" rx="10" ry="5"></ellipse></svg>
        <span class="slot-tag">Photo</span>
        <button class="slot-x" type="button" aria-label="Remove photo"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8 M12 4l-8 8"></path></svg></button>
      </div>
      <span class="pc-caption">Put a coin, card or ruler next to it for scale. What one photo cannot show is guessed.</span>
    </sc-if>

    <div class="pc-field">
      <label for="pp-desc">Describe it</label>
      <div class="pc-area" style="height: 96px;"><textarea id="pp-desc" placeholder="What it is, sizes you know, what it attaches to">Wall bracket for a 25 mm curtain rod, about 50 mm tall. Two holes for 4 mm screws. The rod lifts out of an open cup.</textarea></div>
    </div>
    <div class="pc-field">
      <label for="pp-scale">Scale</label>
      <select id="pp-scale" class="pc-select" style="height: 44px;">
        <option>Find a coin, card or ruler</option>
        <option>Only the sizes in the description</option>
      </select>
    </div>
  </div>
  <div style="flex: none; padding: 12px 16px 34px; background: var(--panel); border-top: 1px solid var(--line);">
    <button class="pc-btn is-primary" type="button" style="width: 100%; height: 44px;">Create and build</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"photos":{"editor":"enum","options":["angles","one"],"default":"angles"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const mode = st.mode ?? (this.props.photos ?? 'angles');
    return {
      theme: this.props.theme ?? 'dark',
      isOne: mode === 'one',
      isAngles: mode === 'angles',
      oneSel: String(mode === 'one'),
      anglesSel: String(mode === 'angles'),
      pickOne: () => this.setState({ mode: 'one' }),
      pickAngles: () => this.setState({ mode: 'angles' }),
    };
  }
}
</script>
</body>
</html>
