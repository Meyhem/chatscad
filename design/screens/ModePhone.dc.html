<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer modes · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/chatscad/components/bundle.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#6e9bff}a:hover{color:#8db1ff}
</style>
</helmet>
<div class="app phone pc-root" data-theme="{{theme}}">
  <header class="topbar">
    <button class="project" type="button" style="padding-left: 0;">18650 holder<svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></button>
    <span class="grow"></span>
    <span class="pc-status is-ok"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5L6.5 12 13 4.5"/></svg>412 ms</span>
    <button class="pc-btn is-icon is-ghost" type="button" aria-label="Share"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8 M4.5 6L8 2.5 11.5 6 M3 9.5v4h10v-4"/></svg></button>
    <button class="pc-btn is-icon is-ghost" type="button" aria-label="Export STL"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8 M4.5 7L8 10.5 11.5 7 M3 13.5h10"/></svg></button>
  </header>
  <div style="flex: none; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);">
    <nav class="pc-tabs" role="tablist" aria-label="Views" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%;">
      <button class="pc-tab" role="tab" aria-selected="true" type="button" style="justify-content: center; height: 40px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5.5 3v6L8 14l-5.5-3V5z M2.5 5L8 8l5.5-3 M8 8v6"/></svg>Project</button>
      <button class="pc-tab" role="tab" aria-selected="false" type="button" style="justify-content: center; height: 40px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z M8 5v3.5l2.5 1.5"/></svg>History</button>
      <button class="pc-tab" role="tab" aria-selected="false" type="button" style="justify-content: center; height: 40px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z M8 1.5v2 M8 12.5v2 M1.5 8h2 M12.5 8h2 M3.4 3.4l1.4 1.4 M11.2 11.2l1.4 1.4 M3.4 12.6l1.4-1.4 M11.2 4.8l1.4-1.4"/></svg>Settings</button>
    </nav>
  </div>
  <div class="phone-body">
    <div class="chat-scroll scroll-col" style="justify-content: flex-end; padding: 12px;">
      <div class="run is-folded"><div class="run-head"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5v-3h3 M10.5 2.5h3v3 M13.5 10.5v3h-3 M5.5 13.5h-3v-3 M5.5 8.2l1.8 1.8 3.3-3.6"/></svg><span style="font-weight: 600;">Agent run</span><span class="pc-caption">Passed in round 2 · v3</span><span class="grow"></span><span class="pc-caption pc-mono">$0.104</span><button class="pc-btn is-sm is-ghost" type="button">Show</button></div></div>
      <div class="pc-msg is-user"><div class="pc-msg-body">Make the walls 3 mm.</div></div>
      <div class="pc-msg is-assistant"><div class="pc-msg-body">Set <code>wall = 3</code>. The body grows to 90 mm long.</div>
        <div class="pc-msg-meta"><span class="pc-chip"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8h-3v-3z"/></svg>Edit</span><span class="pc-chip is-accent"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2c.6 3.2 2.8 5.4 6 6-3.2.6-5.4 2.8-6 6-.6-3.2-2.8-5.4-6-6 3.2-.6 5.4-2.8 6-6z"/></svg>v4</span><span>claude-sonnet-5-5</span><span class="pc-mono">1,180 tok · $0.006</span></div></div>
    </div>
    <div class="chat-foot composer-stack" style="position: relative;">
      
      <div class="mode-row"><div class="pc-tabs mode-seg" role="radiogroup" aria-label="Mode"><button class="pc-tab" role="radio" aria-checked="false" aria-selected="false" type="button" style="height: 36px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8h-3v-3z"/></svg>Edit</button><button class="pc-tab is-agent" role="radio" aria-checked="true" aria-selected="true" type="button" style="height: 36px;"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5v-3h3 M10.5 2.5h3v3 M13.5 10.5v3h-3 M5.5 13.5h-3v-3 M5.5 8.2l1.8 1.8 3.3-3.6"/></svg>Agent</button></div><span class="mode-sum">gpt-5 · 3 rounds</span><span class="grow"></span><button class="pc-btn is-icon is-ghost" type="button" aria-label="Agent settings" aria-haspopup="dialog"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z M8 1.5v2 M8 12.5v2 M1.5 8h2 M12.5 8h2 M3.4 3.4l1.4 1.4 M11.2 11.2l1.4 1.4 M3.4 12.6l1.4-1.4 M11.2 4.8l1.4-1.4"/></svg></button></div>
      
      <div class="pc-composer is-agent">
        <textarea rows="2" placeholder="Describe the part. The agent plans, builds and reviews it." aria-label="Request"></textarea>
        <div class="pc-composer-bar">
          <button class="pc-btn is-icon is-ghost" type="button" aria-label="Attach image or sketch"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v9h-11z M2.5 10.5l3.5-3 3 2.5 2-1.5 2.5 2"/></svg></button>
          <button class="pc-btn is-icon is-ghost" type="button" aria-label="Dictate"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5a2 2 0 0 1 4 0v4a2 2 0 0 1-4 0z M3.5 7.5a4.5 4.5 0 0 0 9 0 M8 12v2"/></svg></button>
          <span class="pc-spacer"></span>
          <button class="pc-btn is-primary" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5v-3h3 M10.5 2.5h3v3 M13.5 10.5v3h-3 M5.5 13.5h-3v-3 M5.5 8.2l1.8 1.8 3.3-3.6"/></svg>Run agent</button>
        </div>
        <div class="opt-row"><button class="opt" type="button">claude-sonnet-5-5<svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></button><button class="opt is-sans" type="button"><span class="opt-k">Effort</span>Medium<svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></button></div>
      </div>
    </div>
  </div>
  <nav class="pc-tabbar" role="tablist" aria-label="Panels">
    <button class="pc-tab" role="tab" aria-selected="true" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5v-3h3 M10.5 2.5h3v3 M13.5 10.5v3h-3 M5.5 13.5h-3v-3 M5.5 8.2l1.8 1.8 3.3-3.6"/></svg>Agent</button>
    <button class="pc-tab" role="tab" aria-selected="false" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5L2 8l3.5 3.5 M10.5 4.5L14 8l-3.5 3.5"/></svg>Code</button>
    <button class="pc-tab" role="tab" aria-selected="false" type="button"><svg class="pc-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5.5 3v6L8 14l-5.5-3V5z M2.5 5L8 8l5.5-3 M8 8v6"/></svg>3D</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
